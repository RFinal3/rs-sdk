name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install webclient dependencies
        working-directory: server/webclient
        run: bun install --frozen-lockfile

      - name: Install engine dependencies
        working-directory: server/engine
        run: bun install --frozen-lockfile

      - name: Test Astra bridge and Python kit
        run: |
          bun test astra-world/bridge
          PYTHONPATH=astra-world/kit python3 -m unittest discover -s astra-world/kit/tests
          PYTHONPATH=astra-world/kit:astra-world/runner python3 -m unittest discover -s astra-world/runner/runner_tests -t astra-world/runner

      - name: Build game content for compiled-script regression tests
        working-directory: server/engine
        env:
          BUILD_VERIFY: "false"
        run: bun run build

      - name: Type-check, test, and verify generated docs
        run: bun run check
