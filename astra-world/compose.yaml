# astra-world: Ryan's private world + Astra's player, all Linux containers.
#
#   docker compose -f astra-world/compose.yaml up -d --build      (from the repo root)
#   open http://127.0.0.1:8888/rs2.cgi                             (play / watch)
#   docker compose -f astra-world/compose.yaml exec player python3 /opt/rs/astra-world/kit/live_check.py
#
# Nothing is reachable from outside this PC: ports bind to 127.0.0.1 only.
# The player container is on the internal `game` network only: no internet, no host.
name: rsworld

services:
  world:
    build:
      context: ..
      dockerfile: server/Dockerfile      # upstream's own Linux image (engine + gateway + web client)
    image: rsworld-world:local
    environment:
      WEB_PORT: "8888"
      NODE_TICKRATE: "400"               # ms per tick; raise to slow the world for early experiments
      NODE_XPRATE: "${NODE_XPRATE:-1}"   # XP multiplier. Upstream rs-sdk defaults to 25 ("accelerated XP for
                                         # botting"); 1 = normal RuneScape rates. Ryan's call.
      # Staff (admin) for Ryan's own character: ::teleto, ::setvis 2, ::tele, ::setstat. Granted only to
      # a listed name that logs in with STAFF_PASSWORD (8+ characters). Both live in astra-world/.env,
      # which only compose reads; only this container gets them, never the player or runner.
      NODE_STAFF_USERNAMES: "${STAFF_USERNAMES:-}"
      NODE_STAFF_PASSWORD: "${STAFF_PASSWORD:-}"
    volumes:
      - rsworld-data:/opt/server/data    # saves + db; back this up before experiments
    ports:
      - "127.0.0.1:8888:8888"            # web client: play, watch
      - "127.0.0.1:7780:7780"            # gateway: only needed for watch mode A (browser-attached Astra)
    networks: [game, edge]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8888/rs2.cgi').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # The player: Astra's game client and bridge (her hands and eyes). Built from ASTRA_WORLD_SRC,
  # Astra's own copy of this repo, when set (else this checkout). Her bridge, kit and
  # player-entry.sh are also mounted live from it, so her changes take effect when the player
  # restarts; she can ask for that by creating <harness>/control/restart-player.
  # Ryan's controls stay out of her reach: owner/ is read-only, this file and .env are read only
  # by compose on Ryan's PC, and the world and the runner are always built from this checkout.
  player:
    build:
      context: ${ASTRA_WORLD_SRC:-..}
      dockerfile: astra-world/player.Dockerfile
      args:
        PLAYER_CAMERA: "${PLAYER_CAMERA:-true}"   # include Chromium for the camera mode
    image: rsworld-player:local
    environment:
      BOT_USERNAME: "${BOT_USERNAME:-Astra}"
      PLAYER_CLIENT: "${PLAYER_CLIENT:-lite}"   # lite | headless-browser (camera) | browser
      WORLD_HOST: "world"
      SHOW_CHAT: "${SHOW_CHAT:-false}"          # Ryan decides; chat is untrusted input either way
    entrypoint: ["bash", "/opt/rs/astra-world/player-entry.sh"]
    volumes:
      - player-secrets:/secrets
      - "${ASTRA_HARNESS_DIR:-./harness}:/harness"   # Astra's harness + goal file + reports (she writes here)
      - "./owner:/owner:ro"                           # Ryan's limits.json; read-only to everything here
      # Astra's code, live (read-only inside the container; she edits it from her side).
      - "${ASTRA_WORLD_SRC:-..}/astra-world/bridge:/opt/rs/astra-world/bridge:ro"
      - "${ASTRA_WORLD_SRC:-..}/astra-world/kit:/opt/rs/astra-world/kit:ro"
      - "${ASTRA_WORLD_SRC:-..}/astra-world/player-entry.sh:/opt/rs/astra-world/player-entry.sh:ro"
    networks: [game]
    depends_on:
      world:
        condition: service_healthy
    restart: unless-stopped

  # The runner: plays Astra's queued cards one session at a time, enforces STOP, mirrors the
  # game into her folder and writes events to her inbox. Never acts in the game itself.
  # Shares the player's network (the bridge is on the player's 127.0.0.1:7790), not its
  # processes or its secrets volume, so it never sees the character's password.
  runner:
    build:
      context: ..                        # always this checkout: STOP is enforced here, not in Astra's code
      dockerfile: astra-world/runner.Dockerfile
    image: rsworld-runner:local
    network_mode: "service:player"
    volumes:
      - "${ASTRA_HARNESS_DIR:-./harness}:/harness"
      - "./owner:/owner:ro"
    depends_on:
      player:
        condition: service_started
        restart: true                    # follow the player when it restarts (its network goes with it)
    restart: unless-stopped
    stop_grace_period: 30s               # time to stop a session in phases (SIGTERM, /cancel, SIGKILL)

  # decision:   the protected Jev decision service goes here later (r2 option B):
  #             holds the provider key, reachable from `player` on its own internal
  #             network, egress only to the provider. Not part of this stack yet.

networks:
  game:
    internal: true
  edge: {}

volumes:
  rsworld-data: {}
  player-secrets: {}
